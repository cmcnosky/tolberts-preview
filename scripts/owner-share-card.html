<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s owner link card — artwork source</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;color:#f3e9d2;background:#173c32}
    .card{position:relative;display:grid;grid-template-columns:660px 540px;width:1200px;height:630px}
    .copy{padding:43px 30px 36px 60px;position:relative;z-index:2;border-right:2px solid #24211c}
    .masthead{display:flex;align-items:center;gap:30px}
    .logo{width:196px;height:94px;object-fit:contain}
    .badge{padding:10px 14px;border:1px solid #e9b852;color:#e9b852;font-size:14px;line-height:1.3;font-weight:700;letter-spacing:2px}
    h1{margin:35px 0 17px;font-family:'Barlow Condensed',sans-serif;font-size:116px;line-height:.88;letter-spacing:-1px;font-weight:800;text-transform:uppercase}
    h1 em{font-style:normal;color:#e9b852}
    .intro{font-family:'DM Serif Display',serif;font-size:29px;line-height:1.2;max-width:530px;margin:24px 0 0}
    .tools{position:absolute;left:60px;right:35px;bottom:42px;padding-top:20px;border-top:1px solid #6c8378;font-size:19px;line-height:1.35;font-weight:700;letter-spacing:1.5px}
    .photo{background:#f3e9d2;padding:41px 34px 36px;position:relative;color:#24211c}
    figure{margin:0;padding:10px 10px 0;border:2px solid #24211c;background:#fff8e9;box-shadow:7px 7px 0 #b8a789;transform:rotate(2deg)}
    figure img{display:block;width:448px;height:432px;object-fit:contain;background:#25251f}
    figcaption{display:flex;justify-content:space-between;padding:15px 3px;font-size:13px;font-weight:700;letter-spacing:1.4px;line-height:1.4}
    .signature{position:absolute;bottom:29px;left:39px;right:30px;font-family:'DM Serif Display',serif;font-size:23px;font-style:italic;color:#922e20}
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <div class="masthead"><img class="logo" src="../assets/logo-white.png" alt="Tolbert’s"><span class="badge">INTERACTIVE<br>OWNER DEMO</span></div>
      <h1>The owner<br><em>room.</em></h1>
      <p class="intro">A working look behind the red sign.</p>
      <div class="tools">MENU · MUSIC · HOURS · SAMPLE STOCK</div>
    </section>
    <section class="photo" aria-label="Tolbert’s on Main Street">
      <figure><img src="../assets/main-street.webp" alt="Tolbert’s sign at Main and Franklin in Grapevine"><figcaption><span>MAIN &amp; FRANKLIN</span><span>GRAPEVINE, TEXAS</span></figcaption></figure>
      <div class="signature">Hot chili. Cold beer. Live music.</div>
    </section>
  </main>
</body>
</html>
