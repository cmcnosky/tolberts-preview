<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s link preview artwork</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden}
    body{background:#922e20;color:#f3e9d2;font-family:'DM Sans',Arial,sans-serif}
    .artwork{position:relative;height:550px;overflow:hidden;background-color:#922e20;background-image:radial-gradient(rgba(36,33,28,.2) 1px,transparent 1px);background-size:8px 8px;border-bottom:5px solid #24211c}
    .artwork:before{content:"";position:absolute;inset:18px;border:2px solid rgba(243,233,210,.32);pointer-events:none}
    .brand{position:absolute;z-index:2;top:27px;left:48px;width:224px;height:108px}
    .brand img{display:block;width:100%;height:100%;object-fit:contain}
    .copy{position:absolute;z-index:2;left:52px;top:161px;width:548px}
    h1{margin:0;color:#f3e9d2;font:800 96px/.88 'Barlow Condensed',Arial,sans-serif;letter-spacing:-1.8px;text-transform:uppercase;text-shadow:3px 3px 0 rgba(36,33,28,.28)}
    h1 em{display:block;margin-top:12px;color:#e9b852;font:400 italic 82px/1.05 'DM Serif Display',Georgia,serif;letter-spacing:-3px;text-transform:none}
    .photo{position:absolute;z-index:2;top:42px;right:47px;width:502px;height:454px;margin:0;padding:15px 15px 58px;background:#f3e9d2;border:3px solid #24211c;box-shadow:9px 9px 0 #24211c;transform:rotate(-1.8deg)}
    .photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 39%;border:2px solid #24211c}
    .caption{position:absolute;left:20px;right:20px;bottom:15px;color:#24211c}
    .caption strong{font:800 29px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.1px}
    .foot{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:#263f34;color:#f3e9d2;font:800 27px/1.1 'Barlow Condensed',Arial,sans-serif;letter-spacing:1px}
    .foot span:last-child{color:#e9b852}
  </style>
</head>
<body>
  <main class="artwork">
    <div class="brand" aria-label="Tolbert’s Restaurant and Chili Parlor">
      <img src="../assets/logo-white.png" alt="Tolbert’s">
    </div>
    <section class="copy">
      <h1>Hot chili.<br>Cold beer.<em>Live music.</em></h1>
    </section>
    <figure class="photo">
      <img src="../assets/main-street.webp" alt="Tolbert’s Main Street sign">
      <figcaption class="caption"><strong>MAIN &amp; FRANKLIN</strong></figcaption>
    </figure>
  </main>
  <footer class="foot">
    <span>423 SOUTH MAIN STREET</span>
    <span>A TEXAS ORIGINAL · EST. 1976</span>
  </footer>
</body>
</html>
