<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s main website link card — artwork source</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;color:#24211c;background:#f3e9d2}
    .card{position:relative;display:grid;grid-template-columns:660px 540px;width:1200px;height:630px}
    .copy{padding:43px 30px 36px 60px;position:relative;z-index:2;border-right:2px solid #24211c}
    .masthead{display:flex;align-items:center;gap:30px}
    .logo{width:196px;height:94px;object-fit:contain;filter:brightness(0) saturate(100%) invert(20%) sepia(67%) saturate(1660%) hue-rotate(340deg) brightness(94%) contrast(95%)}
    .badge{padding:10px 0 10px 22px;border-left:1px solid #b8a789;color:#922e20;font-size:16px;line-height:1.45;font-weight:700;letter-spacing:2px}
    h1{margin:35px 0 17px;font-family:'Barlow Condensed',sans-serif;font-size:108px;line-height:.93;letter-spacing:-1px;font-weight:800;text-transform:uppercase}
    h1 em{display:inline-block;margin-top:7px;font-family:'DM Serif Display',serif;font-size:91px;letter-spacing:-3px;text-transform:none;font-style:italic;color:#922e20}
    .intro{font-family:'DM Serif Display',serif;font-size:29px;line-height:1.2;max-width:530px;margin:24px 0 0}
    .tools{position:absolute;left:60px;right:35px;bottom:42px;padding-top:20px;border-top:1px solid #b8a789;font-size:19px;line-height:1.35;font-weight:700;letter-spacing:1.5px}
    .photo{background:#173c32;padding:41px 34px 36px;position:relative;color:#24211c}
    figure{margin:0;padding:10px 10px 0;border:2px solid #24211c;background:#fff8e9;box-shadow:7px 7px 0 #102d26;transform:rotate(2deg)}
    figure img{display:block;width:448px;height:432px;object-fit:contain;background:#25251f}
    figcaption{display:flex;justify-content:space-between;padding:15px 3px;font-size:13px;font-weight:700;letter-spacing:1.4px;line-height:1.4}
    .signature{position:absolute;bottom:29px;left:39px;right:30px;font-family:'DM Serif Display',serif;font-size:23px;font-style:italic;color:#f3e9d2}
  </style>
</head>
<body>
  <main class="card">
    <section class="copy">
      <div class="masthead"><img class="logo" src="../assets/logo-white.png" alt="Tolbert’s"><span class="badge">RESTAURANT &amp;<br>CHILI PARLOR</span></div>
      <h1>Hot chili.<br>Cold beer.<br><em>Live music.</em></h1>
      <div class="tools">A TEXAS ORIGINAL · GRAPEVINE</div>
    </section>
    <section class="photo" aria-label="Tolbert’s on Main Street">
      <figure><img src="../assets/main-street.webp" alt="Tolbert’s sign at Main and Franklin in Grapevine"><figcaption><span>MAIN &amp; FRANKLIN</span><span>GRAPEVINE, TEXAS</span></figcaption></figure>
      <div class="signature">Pull up a chair on Main Street.</div>
    </section>
  </main>
</body>
</html>
