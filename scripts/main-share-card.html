<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s link artwork — Texas Flood on the Main Street stage</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      --red: #922e20;
      --cream: #f3e9d2;
      --gold: #e9b852;
      --green: #263f34;
      --ink: #24211c;
      color: var(--cream);
      background: var(--red);
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }
    .cover {
      height: 549px;
      display: grid;
      grid-template-columns: 558px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      background-image: radial-gradient(#54241836 .85px, transparent 1px);
      background-size: 7px 7px;
    }
    .title-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px 0 32px 44px;
    }
    .mast { display: flex; align-items: center; gap: 30px; }
    .wordmark { width: 269px; height: auto; }
    .bowl {
      display: block;
      width: 172px;
      height: 127px;
      border: 4px solid var(--cream);
      object-fit: cover;
      object-position: 48% 50%;
    }
    h1 {
      margin: 0;
      font: 800 122px/.85 'Barlow Condensed', 'Arial Narrow', sans-serif;
      text-transform: uppercase;
      letter-spacing: -2.7px;
    }
    h1 em {
      display: block;
      margin-top: 9px;
      color: var(--gold);
      font: italic 400 96px/1.04 'DM Serif Display', Georgia, serif;
      letter-spacing: -4px;
      text-transform: none;
    }
    .performance {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      margin: 24px 30px 24px 12px;
      border: 6px solid var(--cream);
      background: var(--cream);
    }
    .performance img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 80%;
      filter: brightness(1.2) saturate(.78);
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 8px 10px 5px;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.05;
    }
    figcaption strong { font: 400 34px/1.1 'DM Serif Display', Georgia, serif; }
    figcaption span { font-size: 28px; letter-spacing: 1.3px; text-transform: uppercase; }
    footer {
      height: 81px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      border-top: 3px solid var(--ink);
      background: var(--green);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    footer span:last-child { color: var(--gold); }
  </style>
</head>
<body>
  <main class="cover">
    <section class="title-panel">
      <div class="mast">
        <img class="wordmark" src="../assets/logo-white.png" alt="Tolbert’s">
        <img class="bowl" src="../assets/hero-chili.webp" alt="Tolbert’s Bowl of Red">
      </div>
      <h1>Hot chili.<br>Cold beer.<em>Live music.</em></h1>
    </section>
    <figure class="performance">
      <img src="../assets/texas-flood-tolberts-stage.webp" alt="Tommy Katona playing guitar under the Tolbert’s stage sign">
      <figcaption><strong>Tommy Katona</strong><span>Texas Flood</span></figcaption>
    </figure>
  </main>
  <footer><span>423 South Main Street</span><span>Grapevine, Texas</span></footer>
</body>
</html>
