<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s at Main and Franklin — chili and Texas Flood</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; }
    .cover {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr) 417px;
      gap: 4px;
      background: #f3e9d2;
    }
    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .storefront { grid-row: span 2; object-position: 90% center; }
    .chili { object-position: 50% 50%; }
  </style>
</head>
<body>
  <main class="cover" aria-label="Tolbert’s Restaurant and Chili Parlor in Grapevine">
    <img class="storefront" src="../assets/main-street.webp" alt="The tall red Tolbert’s sign outside the restaurant at Main and Franklin">
    <img class="chili" src="../assets/hero-chili.webp" alt="Tolbert’s Bowl of Red with cheese, onions and a green pepper">
    <img src="../assets/texas-flood-guitar-detail.webp" alt="Tommy Katona of Texas Flood playing his electric guitar at Tolbert’s">
  </main>
</body>
</html>
