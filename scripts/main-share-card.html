<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tolbert’s website link card artwork</title><link rel="stylesheet" href="../fonts.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:#173c32;color:#f3e9d2}.card{width:1200px;height:630px;position:relative;background-image:repeating-linear-gradient(0deg,#ffffff05 0,#ffffff05 1px,transparent 1px,transparent 4px),repeating-linear-gradient(90deg,#ffffff04 0,#ffffff04 1px,transparent 1px,transparent 4px)}
.masthead{height:144px;background:#f3e9d2;border-bottom:5px solid #2c4036;display:flex;align-items:center;justify-content:space-between;padding:12px 46px;color:#24211c}.brand{width:260px;height:116px;padding:8px 10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#a6cc70;border:1.5px solid #111}.logo{width:230px;height:76px;object-fit:contain;filter:brightness(0) saturate(100%) invert(27%) sepia(33%) saturate(4500%) hue-rotate(5deg) brightness(90%) contrast(90%)}.tagline{font:800 19px/20px 'Barlow Condensed',sans-serif;letter-spacing:.6px}.location{text-align:right;font-weight:700;font-size:23px;line-height:1.45;letter-spacing:2px}.location span{display:block;color:#8c3325;font-size:16px;letter-spacing:3px;margin-bottom:4px}
.copy{position:absolute;left:48px;top:183px;width:575px}h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:111px;line-height:.94;font-weight:800;letter-spacing:-1.5px;text-transform:uppercase}h1 em{font-style:normal;color:#e2c15d}.signature{font-size:23px;line-height:1.35;margin:27px 0 0;color:#f3e9d2}
figure{position:absolute;top:175px;right:43px;width:473px;margin:0;padding:10px 10px 0;border:2px solid #24211c;background:#fff8e9;box-shadow:7px 8px 0 #42291d;transform:rotate(2deg);color:#24211c}figure img{width:449px;height:372px;display:block;object-fit:contain;background:#25251f}figcaption{display:flex;justify-content:space-between;padding:12px 4px;font:700 14px/1.3 'DM Sans',sans-serif;letter-spacing:1px}
</style></head><body><main class="card"><header class="masthead"><div class="brand"><img class="logo" src="../assets/logo-white.png" alt="Tolbert’s"><div class="tagline">RESTAURANT &amp; CHILI PARLOR</div></div><div class="location"><span>A TEXAS ORIGINAL</span>GRAPEVINE, TEXAS</div></header><section class="copy"><h1>Hot chili.<br>Cold beer.<br><em>Live music.</em></h1><p class="signature">Pull up a chair on Main Street.</p></section><figure><img src="../assets/main-street.webp" alt="The Tolbert’s sign at Main and Franklin"><figcaption><span>MAIN &amp; FRANKLIN</span><span>DALLAS-BORN 1976</span></figcaption></figure></main></body></html>
