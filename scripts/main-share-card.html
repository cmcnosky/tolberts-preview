<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s link artwork — Texas Flood on the Main Street stage</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      --red: #922e20;
      --cream: #f3e9d2;
      --gold: #e9b852;
      --green: #263f34;
      --ink: #24211c;
      color: var(--cream);
      background: var(--red);
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }
    .cover {
      height: 566px;
      display: grid;
      grid-template-columns: 460px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      background-image: radial-gradient(#54241836 .85px, transparent 1px);
      background-size: 7px 7px;
    }
    .title-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 29px 16px 23px 30px;
    }
    .mast { display: flex; align-items: center; gap: 17px; }
    .wordmark { width: 242px; height: auto; }
    .bowl {
      display: block;
      width: 145px;
      height: 108px;
      border: 4px solid var(--cream);
      object-fit: cover;
      object-position: 48% 50%;
    }
    h1 {
      margin: 0;
      white-space: nowrap;
      font: 800 100px/.90 'Barlow Condensed', 'Arial Narrow', sans-serif;
      text-transform: uppercase;
      letter-spacing: -2.7px;
    }
    h1 em {
      display: block;
      margin-top: 9px;
      color: var(--gold);
      font: italic 400 83px/1.04 'DM Serif Display', Georgia, serif;
      letter-spacing: -4px;
      text-transform: none;
    }
    .performance {
      display: block;
      margin: 8px 10px 8px 0;
      border: 4px solid var(--cream);
      background: #200e26;
    }
    .performance img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .artist-credit {
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-top: 2px solid #f3e9d270;
      margin: 0;
      padding-top: 9px;
      font: 700 28px/1.15 'Barlow Condensed', sans-serif;
      color: var(--cream);
    }
    .artist-credit strong { font: 400 33px/1.12 'DM Serif Display', Georgia, serif; }
    .artist-credit span { color: var(--gold); }
    footer {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      border-top: 3px solid var(--ink);
      background: var(--green);
      font-size: 33px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    footer span:last-child { color: var(--gold); }
  </style>
</head>
<body>
  <main class="cover">
    <section class="title-panel">
      <div class="mast">
        <img class="wordmark" src="../assets/logo-white.png" alt="Tolbert’s">
        <img class="bowl" src="../assets/hero-chili.webp" alt="Tolbert’s Bowl of Red">
      </div>
      <h1>Hot chili.<br>Cold beer.<em>Live music.</em></h1>
      <p class="artist-credit"><strong>Tommy Katona</strong><span>·</span> Texas Flood</p>
    </section>
    <figure class="performance">
      <img src="../assets/texas-flood-main-street-stage.webp" alt="Tommy Katona playing guitar under the Tolbert’s stage sign">
    </figure>
  </main>
  <footer><span>423 South Main Street</span><span>Grapevine, Texas</span></footer>
</body>
</html>
