<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tolbert’s link preview artwork</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden}
    body{background:#922e20;color:#f3e9d2;font-family:'DM Sans',Arial,sans-serif}
    .masthead{height:100px;display:flex;align-items:center;justify-content:space-between;padding:9px 38px;background:#24211c;border-bottom:4px solid #e9b852}
    .brand{display:flex;align-items:center;gap:18px}
    .brand img{width:188px;height:78px;object-fit:contain}
    .brand span{font:700 21px/1.13 'Barlow Condensed',Arial,sans-serif;letter-spacing:1px}
    .masthead-copy{display:flex;align-items:center;gap:22px}
    .location{font:700 26px/1.2 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.7px;color:#e9b852}
    .roots{padding:9px 12px 8px;border:1px solid #e9b852;color:#f3e9d2;font:800 17px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.4px}
    .hero{display:grid;grid-template-columns:22px 586px 592px;height:460px;background:#922e20}
    .rail{display:flex;align-items:center;justify-content:center;background:#e9b852;color:#24211c;overflow:hidden}
    .rail span{white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg);font:800 13px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.8px}
    .copy{position:relative;padding:27px 38px 24px;border-right:3px solid #24211c}
    .eyebrow{margin:0 0 22px;padding-bottom:15px;border-bottom:2px solid rgba(243,233,210,.48);font:700 22px/1.1 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.2px}
    h1{margin:0;font:800 96px/.87 'Barlow Condensed',Arial,sans-serif;letter-spacing:-1.8px;text-transform:uppercase}
    h1 em{display:block;margin-top:12px;color:#e9b852;font:400 76px/1 'DM Serif Display',Georgia,serif;letter-spacing:-2px;text-transform:none}
    .deck{margin:23px 0 0;max-width:470px;color:#f3e9d2;font:500 22px/1.4 'DM Sans',Arial,sans-serif}
    .photo{position:relative;min-width:0;margin:0;overflow:hidden;background:#24211c}
    .photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 42%}
    .photo:after{content:"";position:absolute;inset:54% 0 0;background:linear-gradient(transparent,rgba(36,33,28,.86))}
    .caption{position:absolute;z-index:1;left:31px;bottom:24px;display:flex;flex-direction:column;gap:4px;text-shadow:0 2px 5px #24211c}
    .caption strong{font:400 34px/1 'DM Serif Display',Georgia,serif}
    .caption span{font:700 18px/1.15 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.5px;color:#e9b852}
    .foot{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;background:#263f34;border-top:4px solid #24211c;font:700 23px/1.2 'Barlow Condensed',Arial,sans-serif;letter-spacing:1.1px}
    .foot span:last-child{color:#e9b852}
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <img src="../assets/logo-white.png" alt="Tolbert’s">
      <span>RESTAURANT &amp;<br>CHILI PARLOR</span>
    </div>
    <div class="masthead-copy">
      <span class="location">GRAPEVINE, TEXAS</span>
    </div>
  </header>
  <main class="hero">
    <div class="rail" aria-hidden="true"></div>
    <section class="copy">
      <p class="eyebrow">A TEXAS ORIGINAL · DALLAS ROOTS, 1976</p>
      <h1>Hot chili.<br>Cold beer.<em>Live music.</em></h1>
      <p class="deck">The chili parlor. The Main Street stage.<br>Pull up a chair.</p>
    </section>
    <figure class="photo">
      <img src="../assets/main-street.webp" alt="Tolbert’s Main Street sign">
      <figcaption class="caption"><strong>Main &amp; Franklin</strong><span>DOWNTOWN GRAPEVINE</span></figcaption>
    </figure>
  </main>
  <footer class="foot">
    <span>423 SOUTH MAIN STREET</span>
    <span>MENU &amp; PRICES · LIVE MUSIC · HOURS &amp; LOCATION</span>
  </footer>
</body>
</html>
